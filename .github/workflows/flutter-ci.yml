name: Reusable Flutter CI

on:
  workflow_call:
    inputs:
      flutter-channel:
        description: Flutter release channel
        type: string
        default: stable
      working-directory:
        description: Repository-relative directory containing the Flutter component
        type: string
        default: "."

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: ${{ inputs.flutter-channel }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
